# dsh-terminal-app bundle patch: a plain-terminal chat surface over the same
# dsh-base layer the shipped `headless` profile patches, instead of one-shot
# batch execution. Derive a profile from `headless` (`dsh --from-default-
# profile headless --profile <name>`), then install this package into it —
# it disables headless's own startup/runner rows and installs its own.
#
# Reference: the shipped @deepseek-ai/dsh-headless bundle's own cordis.patch.yml
# disables nothing (it's the base case); this one disables exactly the two
# rows that make it one-shot.

- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true

- insert:
    - id: terminal-startup
      name: 'dsh-terminal-app/startup'

    - id: terminal-runner
      name: 'dsh-terminal-app'
      inject:
        - terminalStartup
      config:
        resumeSessionId: !!js ctx.terminalStartup.resumeSessionId
