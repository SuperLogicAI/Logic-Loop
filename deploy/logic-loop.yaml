AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Logic Loop desktop app in a container on one EC2 host, viewed in a browser
  through noVNC. Reached over SSM port forwarding, and optionally over a public
  Tailscale Funnel URL behind a sign-in page. No inbound AWS ports are opened.

Parameters:
  InstanceType:
    Type: String
    Default: m6i.large
    Description: 8 GB RAM is the floor for the Rust build; non-burstable so the build does not run out of CPU credits.
  RepoUrl:
    Type: String
    Default: https://github.com/SuperLogicAI/Logic-Loop.git
  RepoRef:
    Type: String
    Default: main
    Description: Branch or tag to build.
  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  TailscaleAuthKeyParameter:
    Type: String
    Default: /logic-loop/tailscale-auth-key
    Description: SSM SecureString holding a Tailscale auth key. If it does not exist, Tailscale and the public URL are skipped.
  WebPasswordParameter:
    Type: String
    Default: /logic-loop/web-password
    Description: SSM SecureString with the public URL sign-in password. Generated on first boot if it does not exist.

Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: logic-loop-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:PutParameter]
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TailscaleAuthKeyParameter}
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${WebPasswordParameter}

  Profile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref Role]

  # No ingress rules: the only way in is an SSM session, gated by IAM.
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Logic Loop host, egress only

  Instance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Timeout: PT90M
    Properties:
      ImageId: !Ref LatestAmi
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref Profile
      SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 40, VolumeType: gp3, Encrypted: true }
      Tags:
        - { Key: Name, Value: logic-loop }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y aws-cfn-bootstrap
          signal() { /opt/aws/bin/cfn-signal -e "$1" --stack ${AWS::StackName} --resource Instance --region ${AWS::Region}; }
          trap 'signal 1' ERR
          dnf install -y docker git
          systemctl enable --now docker

          rm -rf /opt/logic-loop
          git clone --depth 1 --branch ${RepoRef} ${RepoUrl} /opt/logic-loop

          cat > /opt/Dockerfile <<'EOF'
          FROM rust:1-bookworm AS build
          RUN apt-get update && apt-get install -y --no-install-recommends \
                libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
                libssl-dev libxdo-dev librsvg2-dev libayatana-appindicator3-dev \
              && rm -rf /var/lib/apt/lists/*
          COPY --from=node:22-bookworm-slim /usr/local /usr/local
          WORKDIR /src
          COPY . .
          RUN npm ci && npx tauri build --no-bundle && ls -l src-tauri/target/release/app

          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends \
                libwebkit2gtk-4.1-0 libxdo3 libayatana-appindicator3-1 librsvg2-common \
                xvfb x11vnc novnc websockify matchbox-window-manager dbus-x11 \
                fonts-dejavu x11-utils git curl ca-certificates procps \
              && rm -rf /var/lib/apt/lists/*
          COPY --from=node:22-bookworm-slim /usr/local /usr/local
          RUN npm install -g @anthropic-ai/claude-code && useradd -m -s /bin/bash app
          COPY --from=build /src/src-tauri/target/release/app /usr/local/bin/logic-loop
          ENV HOME=/home/app SHELL=/bin/bash DISPLAY=:0 GDK_BACKEND=x11 \
              WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 \
              NPM_CONFIG_PREFIX=/home/app/.npm-global \
              PATH=/home/app/.npm-global/bin:/home/app/.local/bin:/usr/local/bin:/usr/bin:/bin
          USER app
          WORKDIR /home/app
          EXPOSE 6080
          # Stale X locks survive a container restart and stop Xvfb from starting; if Xvfb
          # exits anyway, the loop ends and Docker restarts the container.
          # x11vnc has no password: it listens on container loopback only, and the
          # host publishes 6080 on 127.0.0.1 only, so the SSM session is the auth.
          CMD ["bash", "-c", "rm -f /tmp/.X0-lock /tmp/.X11-unix/X0; Xvfb :0 -screen 0 1600x900x24 & sleep 2; matchbox-window-manager -use_titlebar no & x11vnc -display :0 -localhost -forever -shared -nopw -quiet & websockify --web /usr/share/novnc 6080 localhost:5900 & while pgrep -x Xvfb >/dev/null; do dbus-run-session logic-loop; sleep 2; done"]
          EOF

          docker build -t logic-loop -f /opt/Dockerfile /opt/logic-loop
          docker rm -f logic-loop || true
          docker run -d --name logic-loop --restart unless-stopped --shm-size 1g \
            -p 127.0.0.1:6080:6080 -v logic-loop-home:/home/app logic-loop
          sleep 20
          curl -sf -o /dev/null http://127.0.0.1:6080/vnc.html
          docker exec logic-loop bash -c 'xwininfo -root -tree | grep -q "Logic Loop"'

          # Public URL: Tailscale Funnel -> Caddy -> L3 sign-in (deploy/l3) -> noVNC. Only when an auth key exists.
          set +x  # keep the key and password out of cloud-init-output.log
          TS_KEY=$(aws ssm get-parameter --region ${AWS::Region} --name ${TailscaleAuthKeyParameter} --with-decryption --query Parameter.Value --output text 2>/dev/null || true)
          if [ -n "$TS_KEY" ]; then
            if ! PW=$(aws ssm get-parameter --region ${AWS::Region} --name ${WebPasswordParameter} --with-decryption --query Parameter.Value --output text 2>/dev/null); then
              PW=$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)
              aws ssm put-parameter --region ${AWS::Region} --name ${WebPasswordParameter} --type SecureString --value "$PW" >/dev/null
            fi
            (umask 077; echo "$PW" > /opt/l3-password)
            L3=/opt/logic-loop/deploy/l3
            docker rm -f l3-auth caddy || true
            docker run -d --name l3-auth --restart unless-stopped --network host \
              -v $L3:/app:ro -v /opt/l3-password:/run/l3-password:ro python:3.12-alpine python /app/auth.py
            docker run -d --name caddy --restart unless-stopped --network host \
              -v $L3/Caddyfile:/etc/caddy/Caddyfile:ro caddy:2

            curl -fsSL https://tailscale.com/install.sh | sh
            systemctl enable --now tailscaled
            tailscale up --auth-key="$TS_KEY" --hostname logic-loop
            timeout 60 tailscale funnel --bg --https=443 http://127.0.0.1:8080
            TS_HOST=$(tailscale status --json | python3 -c 'import sys, json; print(json.load(sys.stdin)["Self"]["DNSName"].rstrip("."))')
            sleep 5
            test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://$TS_HOST/vnc.html)" = 302
            L3_COOKIE=$(curl -s -o /dev/null -D - --max-time 90 --data-urlencode username=logicloop \
              --data-urlencode "password=$PW" https://$TS_HOST/l3/login | grep -o 'l3_session=[^;]*')
            test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 -H "Cookie: $L3_COOKIE" https://$TS_HOST/vnc.html)" = 200
            set -x
          fi
          signal 0

Outputs:
  InstanceId:
    Value: !Ref Instance
  ConnectCommand:
    Description: Run locally (needs the Session Manager plugin), keep it open.
    Value: !Sub >-
      aws ssm start-session --region ${AWS::Region} --target ${Instance}
      --document-name AWS-StartPortForwardingSession
      --parameters portNumber=6080,localPortNumber=6080
  Url:
    Description: Open while ConnectCommand is running.
    Value: http://localhost:6080/vnc.html?autoconnect=1&resize=scale
  WebPasswordCommand:
    Description: Prints the public URL password (user logicloop). The URL is https://logic-loop.<tailnet>.ts.net
    Value: !Sub aws ssm get-parameter --region ${AWS::Region} --name ${WebPasswordParameter} --with-decryption --query Parameter.Value --output text
