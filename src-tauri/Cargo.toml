[package]
name = "app"
version = "0.1.0"
description = "Logic Loop — a browser-like shell for concurrent AI coding agent terminal sessions."
authors = ["Super Logic AI"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9.0"
base64 = "0.22.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tiny_http = "0.12.0"
getrandom = "0.4.3"
ureq = { version = "3.3.0", features = ["json"] }
tauri-plugin-notification = "2.3.3"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }

# Unix-only: kill_session's killpg. Not built on Windows at all.
[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

# Windows-only: ingest.rs's transcript-replacement identity check needs
# GetFileInformationByHandle. std::os::windows::fs::MetadataExt's
# volume_serial_number()/file_index() would do this without a dependency,
# but both require the unstable `windows_by_handle` feature (rust-lang/rust
# #63010) — not available on stable, confirmed by a real Windows CI failure
# (Plan 032). windows-sys is Microsoft's own zero-transitive-dependency FFI
# bindings crate, so this is a native-API call, not app logic pulled in.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
